<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InterviewOS Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }
    .brand span { color: #818cf8; }
    .badge {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      margin-bottom: 12px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #4f46e5;
      color: #fff;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 12px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 95px; }
    .btn-primary {
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 9px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #6366f1; }
    .result-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #312e81;
      font-size: 11px;
      display: none;
    }
    .score-pill {
      font-size: 14px;
      font-weight: 800;
      color: #34d399;
    }
    .tags {
      margin-top: 6px;
      color: #fca5a5;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Interview<span>OS</span> Clipper</div>
    <span class="badge">SQLite Connected</span>
  </div>

  <div class="tabs">
    <button id="tabJob" class="tab-btn active">1. Clip Job + ATS Scan</button>
    <button id="tabQuestion" class="tab-btn">2. Capture Question</button>
  </div>

  <label for="companyInput">Company Name</label>
  <input id="companyInput" type="text" placeholder="e.g. OpenAI, Stripe, Anthropic..." />

  <label id="contentLabel" for="contentInput">Highlighted Job Description / Page Text</label>
  <textarea id="contentInput" placeholder="Highlight text on LinkedIn, Greenhouse, Workday, or LeetCode Discuss before clicking extension..."></textarea>

  <button id="submitBtn" class="btn-primary">Clip to InterviewOS SQLite DB</button>

  <div id="resultBox" class="result-box"></div>

  <script src="popup.js"></script>
</body>
</html>
